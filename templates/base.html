<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>{% block title %}My Life{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/style.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <nav class="nav">
    <a href="/" class="nav-brand">✦ my life</a>
    <div class="nav-links">
      <a href="/investments"   class="nav-link {% if request.path=='/investments' %}active{% endif %}">investments</a>
      <a href="/subscriptions" class="nav-link {% if request.path=='/subscriptions' %}active{% endif %}">subscriptions</a>
      <a href="/habits" class="nav-link {% if request.path=='/habits' %}active{% endif %}">habits</a>
    </div>
    <div class="nav-user">
      <span class="nav-name">{{ current_user.name }}</span>
      {% if current_user.is_admin %}
      <a href="/admin" class="nav-admin-link">admin</a>
      {% endif %}
      <a href="/logout" class="nav-logout">sign out</a>
    </div>
  </nav>
  <main class="main">{% block content %}{% endblock %}</main>
  <div id="toast"></div>
  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
