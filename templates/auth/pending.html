<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><title>Awaiting Approval — My Life</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/static/css/style.css"/>
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.auth-wrap{width:100%;max-width:420px;padding:2rem 1rem}
.auth-brand{font-family:var(--font-serif);font-style:italic;color:var(--gold);font-size:1.5rem;text-align:center;margin-bottom:2rem;display:block;text-decoration:none}
.auth-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2.2rem 2rem}
.auth-title{font-family:var(--font-serif);font-size:1.8rem;font-weight:300;margin-bottom:.3rem}
.auth-sub{color:var(--text2);font-size:.85rem;margin-bottom:1.6rem}
.auth-field{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1rem}
.auth-field label{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text2)}
.auth-field input{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:.65rem .9rem;color:var(--text);font-size:.95rem;font-family:var(--font-body);outline:none;transition:border-color .2s}
.auth-field input:focus{border-color:var(--gold)}
.auth-btn{width:100%;padding:.7rem;background:var(--gold);color:var(--bg);border:none;border-radius:var(--radius);font-size:.95rem;font-family:var(--font-body);font-weight:500;cursor:pointer;margin-bottom:1.2rem}
.auth-btn:hover{background:var(--gold2)}
.auth-link{text-align:center;font-size:.84rem;color:var(--text2)}
.auth-link a{color:var(--gold)}
.flash{background:rgba(192,86,78,.12);border:1px solid rgba(192,86,78,.3);border-radius:var(--radius);padding:.65rem 1rem;font-size:.84rem;color:var(--red);margin-bottom:1.1rem}
.flash.ok{background:rgba(92,158,106,.1);border-color:rgba(92,158,106,.3);color:var(--green)}
.remember{display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:var(--text2);margin-bottom:1.2rem;cursor:pointer}
</style>
</head><body>
<div class="auth-wrap">
  <a href="/" class="auth-brand">✦ my life</a>
  <div class="auth-card" style="text-align:center">
    <div style="font-size:2.5rem;margin-bottom:1rem">⏳</div>
    <div class="auth-title">Awaiting approval</div>
    <div class="auth-sub" style="margin-bottom:1.6rem">
      Your account has been created but needs admin approval before you can access the app.
      You will be able to sign in once approved.
    </div>
    <div style="font-size:.8rem;color:var(--text3);margin-bottom:1.6rem">
      Signed in as <strong style="color:var(--text2)">{{ current_user.email }}</strong>
    </div>
    <a href="/logout" style="color:var(--text2);font-size:.84rem;text-decoration:none">Sign out</a>
  </div>
</div>
</body></html>
